<!-- @dsCard group="iOS Components" viewport="620x330" name="QuestionCard 问答卡" subtitle="分页式多题：进度 + 选项 + 必答校验" -->
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="../tokens/ios.css"/>
<script>document.documentElement.dataset.platform='ios';</script>
<style>
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  .lbl{font-size:11px;letter-spacing:.06em;color:var(--faint);}
  .note{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0;}
  code{font-family:var(--font-mono);font-size:11px;}
  .ios{font-size:15px;line-height:1.65;}
</style>

<div style="border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--card)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--orange-soft)">
    <span style="font:560 13px var(--font-sans);color:var(--orange-text)">Umbra 需要你确认</span>
    <span style="font:600 12px var(--font-mono);color:var(--orange-text)">2 / 4</span>
  </div>
  <div style="padding:14px">
    <p style="margin:0 0 10px;font:560 15px var(--font-sans)">用哪个模型跑这一步？</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--orange);background:var(--orange-soft);border-radius:var(--radius-md);font-size:15px">glm-4v-plus</span>
      <span style="min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:15px;color:var(--text)">本地小模型</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
      <span style="height:44px;padding:0 16px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--chip);color:var(--faint);font:600 15px var(--font-sans)">下一题</span>
      <span style="font-size:12px;color:var(--muted)">第 3 题必答，先选一项</span>
    </div>
  </div>
</div>
<p class="note">必答未答时提交键置灰，并在旁边给一行原因——不弹 alert。头部 <code>--orange-soft</code> 底 + 等宽进度。</p>
