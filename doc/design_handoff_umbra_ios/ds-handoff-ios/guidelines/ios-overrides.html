<!-- @dsCard group="iOS" viewport="760x360" name="iOS 取值覆盖" subtitle="正文 15px、卡片圆角 14px、行高 44px 起" -->
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="../tokens/ios.css"/>
<script>document.documentElement.dataset.platform='ios';</script>
<style>
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  .lbl{font-size:11px;letter-spacing:.06em;color:var(--faint);}
  .note{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0;}
  code{font-family:var(--font-mono);font-size:11px;}
  .ios{font-size:15px;line-height:1.65;}
</style>

<div style="display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;background:var(--card)">
  <div style="display:grid;grid-template-columns:1.3fr .8fr .8fr 2fr;gap:12px;padding:9px 14px;background:var(--chip);font-size:11px;letter-spacing:.06em;color:var(--faint)"><span>项</span><span>桌面端</span><span>iOS</span><span>理由</span></div>
  <div id="rows"></div>
</div>
<p class="note">用法：根元素加 <code>data-platform="ios"</code>，其余 token 与桌面端共用。橙色「一屏三处」规则不变；语义四色不变；<code>--nav</code> 在 iOS 上只用于浮层底板（录音面板、toast）。</p>
<script>
  var d=[["正文","12.5px","15px","手持视距近、字体渲染更粗"],["列表行主文","12.5px","16px","—"],["列表行副文","10.5–11px","13px","—"],["字段标签","11px + .06em","12px + .06em","字距不变"],["卡片圆角","11–12px","14px","控件 10px（桌面 7–8px）"],["列表行最小高度","—","44 / 60px","Apple 触达底线，带副文 60px"],["页面左右边距","—","16px","—"],["图标块","24px","24/34/44/48px","34 记录行徽标，44 表单头"]];
  document.getElementById('rows').innerHTML=d.map(function(r,i){return '<div style="display:grid;grid-template-columns:1.3fr .8fr .8fr 2fr;gap:12px;padding:10px 14px;font-size:12.5px;'+(i?'border-top:1px solid var(--border-soft)':'')+'"><span>'+r[0]+'</span><span style="color:var(--muted)">'+r[1]+'</span><span style="color:var(--orange-text);font-weight:560">'+r[2]+'</span><span style="color:var(--muted)">'+r[3]+'</span></div>';}).join('');
</script>
