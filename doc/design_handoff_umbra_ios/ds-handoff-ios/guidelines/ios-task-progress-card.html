<!-- @dsCard group="iOS Components" viewport="620x260" name="TaskProgressCard 任务进度卡" subtitle="原地更新，完成/失败转态并给动作" -->
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="../tokens/ios.css"/>
<script>document.documentElement.dataset.platform='ios';</script>
<style>
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  .lbl{font-size:11px;letter-spacing:.06em;color:var(--faint);}
  .note{font-size:11px;line-height:1.6;color:var(--muted);margin:10px 0 0;}
  code{font-family:var(--font-mono);font-size:11px;}
  .ios{font-size:15px;line-height:1.65;}
</style>

<div style="display:flex;flex-direction:column;gap:10px">
  <div style="border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);padding:13px 14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
      <span style="font:560 15px var(--font-sans)">周报整理</span>
      <span style="margin-left:auto;font:600 12px var(--font-mono);color:var(--orange-text)">62%</span>
    </div>
    <div style="height:4px;border-radius:999px;background:var(--chip);overflow:hidden"><span style="display:block;width:62%;height:100%;background:var(--orange)"></span></div>
    <p style="margin:9px 0 0;font-size:13px;color:var(--muted)">正在写第 2 节 · 已用 1分12秒</p>
  </div>
  <div style="border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);padding:13px 14px;display:flex;align-items:center;gap:10px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span style="font:560 15px var(--font-sans)">全部完成 · 耗时 4分08秒</span>
    <span style="margin-left:auto;height:36px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-md);font:560 13px var(--font-sans)">看产出</span>
  </div>
</div>
<p class="note">同一张卡原地更新，不追加新卡。进度、耗时必须真的 tick；完成/失败态各带一个动作按钮（看产出 / 重试任务）。</p>
